<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Правила Pipeline Warning</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef2f5;
    --surface: #ffffff;
    --text: #1b2730;
    --muted: #55656f;
    --line: #cbd5dd;
    --bad: #c62f2a;
    --edge: #2767a8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a242c;
      --surface: #22303a;
      --text: #e6edf2;
      --muted: #9db0be;
      --line: #33454f;
      --bad: #f0665f;
      --edge: #6aa9e8;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 24px 48px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 "Segoe UI", "Noto Sans", system-ui, sans-serif;
  }
  h1 { margin: 0 0 4px; font-size: 26px; font-weight: 600; }
  .lead { margin: 0 0 16px; max-width: 70ch; color: var(--muted); }
  #rules { list-style: none; margin: 16px 0 0; padding: 0; }
  .rule {
    margin-bottom: 12px;
    padding: 14px 16px;
    border-left: 4px solid var(--edge);
    background: var(--surface);
  }
  .rule[data-enabled="false"] { border-left-color: var(--line); }
  .rule[data-enabled="false"] > :not(.head) { opacity: .55; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
  .head .name { flex: 1 1 220px; font-weight: 600; }
  .field { display: grid; grid-template-columns: 110px 1fr; align-items: start; gap: 8px; margin-top: 8px; }
  .field > label, .field > span.title { padding-top: 6px; color: var(--muted); font-size: 14px; }
  .note { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .file-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 34px; }
  .selector { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 13px; }
  input[type="text"] {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: transparent;
    color: inherit;
    font: inherit;
  }
  input.selector { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 13px; }
  input[aria-invalid="true"] { border-color: var(--bad); }
  input[type="file"] { display: none; }
  button, .file-button {
    display: inline-block;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--surface);
    color: inherit;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover, .file-button:hover { border-color: var(--muted); }
  button:focus-visible, .file-button:focus-within, input:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
  .gif-preview { display: block; max-width: 120px; max-height: 80px; }
  .gif-preview:not([src]) { display: none; }
  .result { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
  .result:empty, .error:empty { display: none; }
  .error { margin: 4px 0 0; color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
  <h1>Правила</h1>
  <p class="lead">Правило срабатывает, когда на странице GitLab виден выбранный элемент. Чтобы добавить элемент, откройте нужную страницу GitLab, нажмите на иконку расширения и выберите «Выбрать элемент на странице». Если подходят несколько правил для одной строки пайплайна, работает верхнее.</p>
  <button id="add" type="button">Добавить правило на падение стейджа</button>
  <ul id="rules"></ul>

  <template id="rule-template">
    <li class="rule">
      <div class="head">
        <input class="enabled" type="checkbox" aria-label="Правило включено">
        <input class="name" type="text" aria-label="Название правила">
        <button class="up" type="button" aria-label="Выше">↑</button>
        <button class="down" type="button" aria-label="Ниже">↓</button>
        <button class="fire" type="button">Проверить</button>
        <button class="delete" type="button">Удалить</button>
      </div>
      <div class="field condition-field">
        <span class="title">Условие</span>
        <div class="condition"></div>
      </div>
      <div class="field page-field">
        <label>Страница</label>
        <div>
          <input class="page" type="text" placeholder="все страницы GitLab">
          <p class="note">Адрес без домена. Звёздочка заменяет часть адреса: /avtomarket/*/-/merge_requests/*.</p>
        </div>
      </div>
      <div class="field">
        <label>Ветка</label>
        <div>
          <input class="branch" type="text" placeholder="любая ветка">
          <p class="note branch-note"></p>
        </div>
      </div>
      <div class="field">
        <span class="title">Звук</span>
        <div class="file-row">
          <span class="sound-name"></span>
          <label class="file-button">Выбрать файл<input class="sound-file" type="file" accept="audio/*"></label>
          <button class="sound-clear" type="button">Вернуть встроенный</button>
        </div>
      </div>
      <div class="field">
        <span class="title">Гифка</span>
        <div class="file-row">
          <img class="gif-preview" alt="">
          <span class="gif-name"></span>
          <label class="file-button">Выбрать файл<input class="gif-file" type="file" accept="image/*"></label>
          <button class="gif-clear" type="button">Убрать</button>
        </div>
      </div>
      <p class="result" role="status"></p>
    </li>
  </template>

  <script src="gif-overlay.js"></script>
  <script src="options.js"></script>
</body>
</html>
